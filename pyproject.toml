[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-astra"
version = "0.1.0"
description = "Evidence-grounded LangGraph workflow for MTG spoilers and Forge card scripts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "typer>=0.15,<1",
  "filelock>=3.16,<4",
]

[project.scripts]
forge-astra = "forge_astra.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

